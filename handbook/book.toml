# The chapter manifest. This file and `handbook/tools/generators.py` are the
# only two places a chapter is declared.
#
#   kind = "prose"      a human owns everything above the nav marker
#   kind = "generated"  the generator owns every byte; never edit the file
#
# This is a guide for the people who *use* Elicta. It carries no description
# of how the software is built: no components, no network interfaces, no
# commands. Those generators still exist and are listed in `UNMOUNTED` in
# generators.py with the reason they are not here.
#
# `watches` lists the paths a prose chapter describes — mostly the screens it
# shows. When those move, `check` reports the chapter as suspect and a person
# decides whether the screenshots and the words still match.

[handbook]
title = "The Elicta Handbook"
intro = """
Elicta helps you ask the question you would otherwise have missed — while the
client is still in the room — and then writes up what was agreed, quoting the
words that were actually said.

This is a guide to using it. It goes in the order you will meet it: setting it
up, preparing for an engagement, the meeting itself, and what comes out
afterwards. Every screen is shown.

It assumes nothing about how the software is built. Where something is not
finished, it says so plainly rather than describing an intention in the same
voice as a fact.
"""

