[project]
name = "elicta-service"
version = "0.1.0"
description = "Elicta service tier — context compiler, debrief engine, record-path transcription"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "claude-agent-sdk>=0.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.32",
    "alembic>=1.14",
    # The document connector talks to Microsoft Graph over this. It arrived
    # transitively through the Anthropic SDK and was declared only as a dev
    # dependency, which made a production import depend on somebody else's
    # dependency tree not changing.
    "httpx>=0.27",
    # The streamed live lane's socket. It was already here, transitively,
    # through `uvicorn[standard]` — which is the same mistake `httpx` above
    # records: a production import resting on somebody else's dependency
    # tree, and one that would disappear the day uvicorn's extras changed.
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["src"]
asyncio_mode = "auto"

[tool.ruff]
# Pinned explicitly rather than inherited from ruff's defaults, which shift
# between releases — a lint gate that changes meaning on a version bump is
# not a gate. Line length matches the width the tree was written at.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's stable core; I keeps imports sorted (the largest
# category of drift found in this tree); UP keeps syntax current with the
# 3.12 floor. Deliberately excludes E501 — the tree was not written to a
# hard column limit and reflowing it would bury real changes in noise.
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = [
    # Catching `Exception` at an external-engine boundary is the documented
    # degraded-mode pattern here: a vendor SDK may raise anything, and the
    # whole point is that nothing propagates — the failure is converted into
    # a FAILED status record the caller can read. Fifteen sites do this
    # deliberately, so the rule is off rather than suppressed line by line.
    "BLE001",
    # `class X(str, Enum)` -> `StrEnum` is not behaviour-preserving: `str()`
    # on a StrEnum member yields the value, where a str-Enum yields
    # "X.MEMBER". 35 enums cross the API boundary as response fields, so this
    # sweep needs its own change with serialisation tests, not a lint pass.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test modules assert on wide behaviour and legitimately shadow names.
"**/test_*.py" = ["E501"]
