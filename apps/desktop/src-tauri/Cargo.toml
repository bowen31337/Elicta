[package]
name = "elicta-desktop"
version = "0.1.0"
description = "Elicta desktop shell — Tauri 2 webview over the shared Rust core"
edition = "2021"
license = "UNLICENSED"
publish = false

# Standalone workspace: this crate is nested under the repo root, which owns
# its own Cargo workspace for core/*. This cuts the upward manifest search
# off here so the two stay independent (see the Cargo error message this
# section heads off: "current package believes it's in a workspace when
# it's not").
[workspace]

[lib]
name = "elicta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared capture core. Path-linked rather than vendored so the desktop
# shell and the workspace crates cannot drift to different versions of the
# pause guarantee.
capture = { path = "../../../core/crates/capture" }
tauri-plugin-updater = "2.10.1"
