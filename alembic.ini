# Alembic configuration for the Elicta service tier.
#
# The revisions in migrations/versions were written long before this file
# existed, so `alembic upgrade` could not be run at all. They form a single
# linear chain from `replay_runs` to `reference_documents`.
#
# Run from the repository root:
#   uv run --project apps/service alembic upgrade head          (applies)
#   uv run --project apps/service alembic upgrade head --sql    (prints SQL)
#
# The database URL comes from DATABASE_URL in the environment (see
# .env.example); `sqlalchemy.url` is deliberately left empty so a real
# credential never lives in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
