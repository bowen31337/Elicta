name: Tests

# The gate that was missing. Six workflows built, signed, notarised and
# replay-gated artifacts, but none ran a test suite or a linter — which is
# how a tree whose `cargo test --workspace` did not compile, and which
# carried 143 lint violations, stayed green all the way to a signed release.
#
# One job per language, because a polyglot repo has per-language blind
# spots: a Rust signature change is invisible to a Python gate, and that is
# exactly the break this repo shipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — workspace tests and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # No --exclude: the whole workspace must compile, tests/e2e included.
      # Excluding the integration crate is what let its callers rot.
      - name: Test the workspace
        run: cargo test --workspace --locked

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `cargo fmt --all --check` is deliberately not gated yet: the tree has
      # 326 pre-existing rustfmt hunks across 64 files. Reformatting belongs
      # in its own mechanical commit — landing it here would bury real
      # changes. Add this step once that commit lands:
      #   - run: cargo fmt --all --check

  service:
    name: Service — pytest, migrations and ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install service dependencies
        working-directory: apps/service
        run: uv sync --locked

      - name: Lint
        working-directory: apps/service
        run: uv run ruff check .

      # Includes test_migrations.py, which runs every Alembic revision in
      # offline mode — the chain is validated without needing a database.
      - name: Unit tests
        working-directory: apps/service
        run: uv run pytest -q

      # Drives the production composition root, so a router that stops being
      # mounted fails here rather than shipping unreachable.
      - name: API integration suite
        run: uv run --project apps/service python -m pytest tests/e2e/api_integration -q

  desktop:
    name: Desktop — vitest, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter elicta-desktop typecheck

      - name: Unit tests
        run: pnpm --filter elicta-desktop test

      - name: Typecheck the generated API client
        run: pnpm --filter api-client typecheck

      - name: Build
        run: pnpm --filter elicta-desktop build

      # WCAG 2.2 AA, measured against the rendered DOM rather than asserted
      # from the stylesheet — contrast depends on what a colour composites
      # over, which only exists once the page does. Both themes, because they
      # are two palettes, not one inverted.
      - name: Accessibility audit
        run: |
          pnpm --filter elicta-desktop exec vite --port 1420 &
          npx --yes wait-on http://127.0.0.1:1420/journeys.html -t 60000
          node tests/e2e/journeys/audit-a11y.mjs

  # Documentation as a build artifact, not a promise. `handbook/tools/gen.py`
  # derives the reference chapters from the crates, the OpenAPI schema, the
  # service modules, the desktop features, `.env.example` and the checked-in
  # slash commands, and binds the whole handbook into `handbook/handbook.pdf`.
  # A feature that adds any of those makes a chapter -- and the PDF -- stale,
  # and fails here until the handbook is rebuilt.
  #
  # Standard library only, so there is no install step and nothing to lock.
  # That constraint is why the PDF writer is hand-rolled: this runner has no
  # pandoc, no browser and no LaTeX, and adding one would make the PDF the
  # single artifact that cannot be built where the handbook lives.
  handbook:
    name: Handbook — generated chapters and PDF are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest's testpaths is apps/service/src, so these are never collected
      # by the service job. They run here or nowhere.
      - name: Generator unit tests
        working-directory: handbook/tools
        run: python3 -m unittest --verbose

      # Errors only. Drift is a warning: whether a prose chapter is still
      # true after the code moved is a judgement, and a gate that demands
      # judgement gets switched off rather than satisfied. `stale-pdf` is an
      # error, not a warning -- it is decided by comparing two digests.
      - name: Check
        run: python3 handbook/tools/gen.py check

      # The reproducibility gate. `check` already compares the committed
      # chapters against a fresh render; this catches the other failure --
      # a generator whose output depends on something other than its inputs,
      # which would make every future run of `check` a coin toss.
      #
      # The PDF is safe here because `build` rewrites it only when its
      # source digest moves, so this step never trips on byte-level float
      # differences between Python builds.
      - name: Build is reproducible
        run: |
          python3 handbook/tools/gen.py build
          # --porcelain as well as diff, so a chapter the build *created*
          # counts too; an untracked file is invisible to `git diff`.
          if [ -n "$(git status --porcelain -- handbook/)" ]; then
            git --no-pager diff -- handbook/
            git status --short -- handbook/
            echo "::error::The committed handbook is stale, or the build is not reproducible."
            echo "Run: python3 handbook/tools/gen.py build"
            exit 1
          fi
