name: Probe macOS SDK

# TEMPORARY. Compiles the exact Metal symbols that screencapturekit ->
# apple-metal 0.8.8's Swift bridge references, on each hosted macOS label,
# so the build pin is chosen from evidence. Delete once recorded.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15, macos-26]
    runs-on: ${{ matrix.label }}
    steps:
      - name: Report toolchain
        run: |
          sw_vers; xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Compile the referenced Metal symbols
        run: |
          cat > probe.swift <<'SWIFT'
          import Metal
          func probe(device: MTLDevice, queue: MTLCommandQueue) {
              _ = MTLCommandQueueDescriptor()
              _ = MTLLogStateDescriptor()
              _ = MTLResidencySetDescriptor()
              let s = MTLSamplerDescriptor()
              s.reductionMode = .min
              s.lodBias = 0.0
          }
          SWIFT
          # Report per-symbol rather than aborting on the first failure.
          if swiftc -parse probe.swift 2>probe.err; then
            echo "RESULT ${{ matrix.label }}: ALL SYMBOLS PRESENT"
          else
            echo "RESULT ${{ matrix.label }}: MISSING SYMBOLS"
            cat probe.err
          fi
