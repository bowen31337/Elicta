name: Build Desktop Artifacts

# Builds the Tauri shell over the shared Rust core (core/crates/*) for every
# distribution target from one workflow. macOS builds a single universal
# binary covering both Apple Silicon (arm64) and Intel (x86_64), per PRD
# NFR-3.1. Windows builds x64 and arm64 from the same job template via a
# build matrix (build-windows below) instead of per-platform trigger logic,
# so both architectures always ship together. Developer ID re-signing and
# notarisation of the macOS artifact happen downstream in sign-macos.yml
# (PRD NFR-3.3); Windows artifacts are Authenticode-signed inline below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded universal macOS build artifact
        value: ${{ jobs.build-macos.outputs.artifact-name }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS universal (arm64 + x86_64)
    # Apple Silicon runner: builds aarch64-apple-darwin natively and
    # x86_64-apple-darwin via cross-compilation, then lipo's them together.
    # macos-26 (SDK 26.5): screencapturekit -> apple-metal ships a Swift
    # bridge over Metal 4, referencing MTLSamplerDescriptor.reductionMode and
    # .lodBias alongside MTLResidencySet, MTLLogState and
    # MTLCommandQueueDescriptor. The 14.5 SDK has none of them and 15.5 has
    # only the latter three, so this is the oldest hosted image that builds
    # the dependency at all -- not a preference. Dropping to an older image
    # means pinning screencapturekit back off Metal 4 first.
    runs-on: macos-26
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend assets
        run: pnpm --filter elicta-desktop build

      - name: Build universal macOS bundle
        working-directory: apps/desktop
        env:
          # Real Developer ID identities are injected by sign-macos.yml after
          # this artifact is downloaded; CI falls back to ad-hoc signing so
          # every build here is at least a validly signed Mach-O binary.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: pnpm exec tauri build --target universal-apple-darwin --ci

      - name: Verify universal binary covers arm64 and x86_64
        run: |
          set -euo pipefail
          bundle="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$bundle" ]; then
            echo "no .app bundle produced" >&2
            exit 1
          fi
          exe="$bundle/Contents/MacOS/$(basename "$bundle" .app)"
          archs="$(lipo -archs "$exe")"
          echo "architectures: $archs"
          echo "$archs" | grep -qw arm64
          echo "$archs" | grep -qw x86_64
          echo "BUNDLE_PATH=$bundle" >> "$GITHUB_ENV"

      - name: Verify the artifact is signed
        run: codesign --verify --verbose=2 "$BUNDLE_PATH"

      - name: Set artifact name
        id: artifact
        run: echo "name=elicta-macos-universal-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload universal macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows (${{ matrix.arch }})
    # One job template matrixed over both Windows architectures so x64 and
    # arm64 run the identical steps against the shared Rust core
    # (core/crates/*) — there is no per-arch `if:` branching or separate
    # workflow per architecture, only the matrix substitution below.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            rust-target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend assets
        run: pnpm --filter elicta-desktop build

      - name: Build Windows bundle
        working-directory: apps/desktop
        run: pnpm exec tauri build --target ${{ matrix.rust-target }} --ci

      - name: Prepare code signing certificate
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP "elicta-windows-signing.pfx"
          if ($env:WINDOWS_CERTIFICATE) {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $certPassword = $env:WINDOWS_CERTIFICATE_PASSWORD
          } else {
            # CI fallback so every build here is at least a validly signed PE
            # binary; a real Authenticode certificate is injected via the
            # WINDOWS_CERTIFICATE secret for release signing.
            $certPassword = [Guid]::NewGuid().ToString()
            $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
            $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=Elicta CI (${{ matrix.arch }})" -CertStoreLocation Cert:\CurrentUser\My
            Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $securePassword | Out-Null
          }
          echo "cert-path=$certPath" >> $env:GITHUB_OUTPUT
          echo "::add-mask::$certPassword"
          echo "cert-password=$certPassword" >> $env:GITHUB_OUTPUT

      - name: Sign build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          $bundleDir = "apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          $targets = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe, *.msi
          if (-not $targets) {
            throw "no Windows bundle artifacts found under $bundleDir"
          }
          foreach ($file in $targets) {
            & $signtool sign /f "${{ steps.cert.outputs.cert-path }}" /p "${{ steps.cert.outputs.cert-password }}" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed to sign $($file.FullName)"
            }
          }

      - name: Verify artifacts are signed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          $targets = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe, *.msi
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.FullName): $($signature.Status)"
            if ($signature.Status -eq "NotSigned") {
              throw "$($file.FullName) was not signed"
            }
          }

      - name: Set artifact name
        id: artifact
        shell: bash
        run: echo "name=elicta-windows-${{ matrix.arch }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
