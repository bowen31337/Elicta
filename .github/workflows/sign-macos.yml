name: Sign & Notarize macOS Build

# Takes the ad-hoc-signed universal bundle produced by build.yml, re-signs it
# with the Developer ID Application certificate, submits it to Apple's notary
# service, and staples the resulting ticket to both the .app and the .dmg
# (PRD NFR-3.3). Unnotarised builds are Gatekeeper-blocked, so this is what
# turns a CI build into something that can actually be handed to a user.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: sign-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS artifact
    uses: ./.github/workflows/build.yml
    secrets: inherit

  sign-and-notarize:
    name: Sign, notarise & staple
    needs: build
    runs-on: macos-14
    steps:
      - name: Download universal macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Import Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/sign-macos.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          echo -n "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$cert_path"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Re-sign app bundle with Developer ID
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 5 -name '*.app' | head -n1)"
          if [ -z "$app" ]; then
            echo "no .app bundle found in downloaded artifact" >&2
            exit 1
          fi
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Notarise the app bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/notarize-app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$zip_path"
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple and verify the app bundle
        run: |
          set -euo pipefail
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Rebuild the .dmg around the notarised app
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 5 -name '*.dmg' | head -n1)"
          if [ -z "$dmg" ]; then
            echo "no .dmg found in downloaded artifact" >&2
            exit 1
          fi
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          cp -R "$APP_PATH" "$staging/"
          ln -s /Applications "$staging/Applications"
          rm -f "$dmg"
          hdiutil create -volname "$(basename "$APP_PATH" .app)" \
            -srcfolder "$staging" -ov -format UDZO "$dmg"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      - name: Sign and notarise the .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify the .dmg passes Gatekeeper
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Upload notarised macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: elicta-macos-notarized-${{ github.sha }}
          path: |
            ${{ env.APP_PATH }}
            ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
